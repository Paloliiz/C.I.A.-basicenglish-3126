<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE FILE: M.3 Midterm Protocol</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Fredoka:wght@400;500;600;700&family=Kanit:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --mustard:#E3A62F;
    --burnt:#C1440E;
    --teal:#2A8C82;
    --brown-dark:#3B2A1E;
    --brown-mid:#7A5230;
    --manila:#E4CE9C;
    --manila-dark:#D8BD84;
    --cream:#F5ECD2;
    --stamp-red:#A3272B;
    --ink:#2C2013;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Fredoka',sans-serif;
    color:var(--ink);
    background-color:var(--manila);
    background-image:
      repeating-linear-gradient(0deg, rgba(59,42,30,0.035) 0px, rgba(59,42,30,0.035) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top left, rgba(255,255,255,0.25), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(59,42,30,0.12), transparent 55%);
    min-height:100vh;
  }
  .font-header{font-family:'Righteous', cursive;}
  .font-thai{font-family:'Kanit', sans-serif;}
  .font-type{font-family:'Special Elite', monospace;}
  .brutal{
    border:3px solid var(--brown-dark);
    box-shadow: 6px 6px 0px var(--brown-dark);
  }
  .brutal-sm{
    border:3px solid var(--brown-dark);
    box-shadow: 4px 4px 0px var(--brown-dark);
  }
  .brutal-btn{
    border:3px solid var(--brown-dark);
    box-shadow: 5px 5px 0px var(--brown-dark);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .brutal-btn:active{
    transform: translate(4px,4px);
    box-shadow: 1px 1px 0px var(--brown-dark);
  }
  .brutal-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .paper-clip{
    position:absolute; top:-18px; left:24px; width:34px; height:60px;
    border:5px solid #8a8f94; border-radius:16px 16px 0 0 / 26px 26px 0 0;
    border-bottom:none; transform:rotate(-8deg);
    box-shadow: 2px 2px 3px rgba(0,0,0,0.25);
  }
  .stamp{
    font-family:'Special Elite', monospace;
    transform: rotate(-12deg);
    letter-spacing: 2px;
  }
  @keyframes stampIn{
    0%{ transform: rotate(-12deg) scale(2.4); opacity:0; }
    60%{ transform: rotate(-12deg) scale(0.92); opacity:1; }
    100%{ transform: rotate(-12deg) scale(1); opacity:1; }
  }
  .stamp-anim{ animation: stampIn 0.35s ease-out forwards; }
  @keyframes popIn{
    0%{ transform: scale(0.85); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }
  .pop-in{ animation: popIn 0.25s ease-out; }
  @keyframes hop{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(-6deg); }
  }
  .marker-hop{ animation: hop 0.6s ease-in-out infinite; }
  .tile-done{ background: var(--teal); }
  .tile-current{ background: var(--mustard); }
  .tile-todo{ background: var(--cream); }
  .scrollbar-thin::-webkit-scrollbar{height:8px; width:8px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--brown-mid); border-radius:4px;}
  .hidden-phase{display:none !important;}
  .folder-tab{
    background: var(--burnt);
    border:3px solid var(--brown-dark);
    border-bottom:none;
    box-shadow: 4px -2px 0px var(--brown-dark);
  }
  input[type=text]:focus{ outline:3px solid var(--teal); outline-offset:1px; }
  button:focus-visible, .clickable:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-3 md:py-10">

  <!-- ===================== HEADER / CASE FOLDER TAB ===================== -->
  <div class="w-full max-w-3xl mb-[-3px] relative z-10">
    <div class="folder-tab inline-block px-6 py-2 rounded-t-xl ml-4 md:ml-10">
      <p class="font-type text-cream text-xs md:text-sm tracking-widest">TOP SECRET — KHAO CHAKAN DETECTIVE AGENCY</p>
    </div>
  </div>

  <!-- ===================== MAIN CASE FILE CONTAINER ===================== -->
  <main class="w-full max-w-3xl bg-[var(--cream)] brutal rounded-2xl relative p-5 md:p-8">
    <div class="paper-clip hidden md:block"></div>

    <!-- Title -->
    <div class="flex flex-wrap items-center justify-between gap-2 border-b-4 border-dashed border-[var(--brown-mid)] pb-4 mb-5">
      <h1 class="font-header text-2xl md:text-3xl text-[var(--burnt)]" style="text-shadow:2px 2px 0 var(--brown-dark);">CASE FILE: MIDTERM PROTOCOL</h1>
      <span class="font-type text-xs md:text-sm bg-[var(--mustard)] text-[var(--brown-dark)] px-3 py-1 rounded-full brutal-sm">M.3 · CONFIDENTIAL</span>
    </div>

    <!-- ============ PHASE 1: BRIEFING ============ -->
    <section id="phase1" class="pop-in">
      <div id="slideCard" class="bg-white/70 brutal-sm rounded-xl p-5 md:p-6 min-h-[220px] max-h-[62vh] overflow-y-auto scrollbar-thin flex flex-col justify-between">
        <div>
          <h2 id="slideTitle" class="font-header text-lg md:text-xl text-[var(--teal)] mb-3 sticky -top-5 md:-top-6 bg-white/95 pt-1 pb-2 -mx-1 px-1 z-10 backdrop-blur-sm"></h2>
          <div id="slideBody" class="font-thai text-base leading-relaxed text-[var(--ink)]"></div>
        </div>
      </div>

      <!-- Dots -->
      <div id="dots" class="flex justify-center gap-2 mt-4"></div>

      <!-- Nav -->
      <div class="flex justify-between items-center mt-5 gap-3">
        <button id="prevBtn" class="brutal-btn font-thai font-medium bg-[var(--manila-dark)] px-4 py-2 rounded-lg text-sm md:text-base">← ก่อนหน้า</button>
        <button id="nextBtn" class="brutal-btn font-thai font-medium bg-[var(--teal)] text-white px-4 py-2 rounded-lg text-sm md:text-base">ถัดไป →</button>
        <button id="startBtn" class="hidden-phase brutal-btn font-thai font-bold bg-[var(--burnt)] text-white px-6 py-3 rounded-lg text-sm md:text-base">🕵️ เริ่มภารกิจสืบสวน</button>
      </div>
    </section>

    <!-- ============ PHASE 2: SIMULATION ============ -->
    <section id="phase2" class="hidden-phase">
      <!-- HUD -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="brutal-sm rounded-lg px-4 py-2 bg-[var(--mustard)] font-type text-sm md:text-base">
          🗂️ CASE <span id="qNum">1</span>/<span id="qTotal">26</span>
        </div>
        <div class="brutal-sm rounded-lg px-4 py-2 bg-[var(--burnt)] text-white font-type text-sm md:text-base">
          🔥 STREAK: <span id="streakNum">0</span>
        </div>
      </div>

      <!-- Board Trail -->
      <div id="board" class="brutal-sm rounded-xl p-3 mb-5 bg-white/60 flex flex-wrap gap-1.5 justify-center"></div>

      <!-- Question Card -->
      <div id="questionCard" class="bg-white/70 brutal-sm rounded-xl p-5 md:p-6 min-h-[240px]"></div>
    </section>

    <!-- ============ PHASE 3: MISSION COMPLETE ============ -->
    <section id="phase3" class="hidden-phase text-center py-8">
      <h2 class="font-header text-3xl md:text-4xl text-[var(--burnt)] mb-2" style="text-shadow:3px 3px 0 var(--brown-dark);">CASE CLOSED!</h2>
      <p class="font-thai text-base mb-6 text-[var(--brown-mid)]">คุณได้ไขคดีข้อสอบกลางภาคสำเร็จแล้ว นักสืบมือทอง!</p>
      <div class="inline-block brutal rounded-xl bg-[var(--mustard)] px-8 py-5 mb-6">
        <p class="font-type text-sm text-[var(--brown-dark)]">FINAL SCORE</p>
        <p id="finalScore" class="font-header text-4xl text-[var(--brown-dark)]">26/26</p>
      </div>
      <div>
        <button id="rebootBtn" class="brutal-btn font-thai font-bold bg-[var(--teal)] text-white px-6 py-3 rounded-lg">🔄 รีบูตระบบ</button>
      </div>
    </section>
  </main>

  <!-- ===================== FEEDBACK MODAL ===================== -->
  <div id="modalOverlay" class="hidden-phase fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-[var(--cream)] brutal rounded-2xl p-6 md:p-8 max-w-sm w-full relative">
      <div class="flex justify-center mb-3">
        <div id="stampEl" class="stamp stamp-anim border-4 border-[var(--stamp-red)] text-[var(--stamp-red)] px-4 py-2 rounded-md text-xl md:text-2xl font-bold">
          EVIDENCE<br>REJECTED
        </div>
      </div>
      <p id="rejectMsg" class="font-thai text-center text-base text-[var(--ink)] mb-1"></p>
      <p class="font-thai text-center text-sm text-[var(--brown-mid)] mb-4">กลับไปพิจารณาเบาะแส (Grammar File) แล้วลองใหม่อีกครั้งนะนักสืบ</p>

      <div id="hintWrap" class="mb-4">
        <button id="hintBtn" class="w-full font-thai text-sm text-[var(--teal)] underline decoration-dotted underline-offset-4">💡 ติดจริงๆ ขอคำใบ้หน่อย</button>
        <p id="feedbackText" class="hidden-phase font-thai text-center text-sm bg-white/70 border-2 border-dashed border-[var(--brown-mid)] rounded-lg p-3 mt-2 text-[var(--ink)]"></p>
      </div>

      <button id="retryBtn" class="brutal-btn font-thai font-bold bg-[var(--burnt)] text-white w-full py-3 rounded-lg">🔁 ลองอีกครั้ง</button>
    </div>
  </div>

<script>
/* ===================== CONTENT PAYLOAD ===================== */
const SLIDES = [
  { title: "Khao Chakan Witthayakhom: Midterm Protocol", html: `
    <p class="mb-3">ยินดีต้อนรับสู่หน่วยสืบสวนสอบสวน! ก่อนออกปฏิบัติภารกิจ นักสืบทุกคนต้องตรวจสอบ "แฟ้มไวยากรณ์" ทั้ง 5 แฟ้มให้ครบก่อน เพื่อเตรียมพร้อมออกภาคสนาม</p>
    <ul class="list-disc pl-5 space-y-1 text-[var(--brown-mid)]">
      <li>แฟ้มที่ 1: Pronouns (คำสรรพนาม)</li>
      <li>แฟ้มที่ 2: Can &amp; Have got</li>
      <li>แฟ้มที่ 3: Present Simple &amp; Adverbs of Frequency</li>
      <li>แฟ้มที่ 4: Wh-Questions &amp; Prepositions</li>
      <li>แฟ้มที่ 5: Quantifiers (many/much/some/any)</li>
    </ul>
    <p class="mt-3">อ่านให้ละเอียด แล้วกดปุ่ม <b>"เริ่มภารกิจสืบสวน"</b> ที่แฟ้มสุดท้าย โชคดีนักสืบ! 🕵️‍♀️</p>
  `},
  { title: "Grammar File 1: Pronouns (คำสรรพนาม)", html: `
    <p class="mb-2">Pronoun คือคำที่ใช้แทนคำนาม แบ่งเป็น 2 แบบหลักที่ต้องรู้ในเรื่องนี้ คือ <b>Subject Pronoun</b> (ประธาน) และ <b>Possessive Pronoun</b> (สรรพนามแสดงความเป็นเจ้าของ ที่ใช้แทนคำนามได้เลยโดยไม่ต้องมีนามตามหลัง)</p>
    <table class="w-full text-sm border-collapse mb-3">
      <thead>
        <tr class="bg-[var(--mustard)]">
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">Subject</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">ความหมาย</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">Possessive Pronoun</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">ความหมาย</th>
        </tr>
      </thead>
      <tbody>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">I</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ฉัน</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">mine</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของฉัน</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">You</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">คุณ</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">yours</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของคุณ</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">We</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">พวกเรา</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ours</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของพวกเรา</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">They</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">พวกเขา</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">theirs</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของพวกเขา</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">He</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เขา (ผู้ชาย)</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">his</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของเขา (ผู้ชาย)</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">She</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เธอ</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">hers</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของเธอ</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">It</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">มัน</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">its</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ของมัน</td></tr>
      </tbody>
    </table>
    <div class="bg-[var(--stamp-red)]/10 border-2 border-[var(--stamp-red)] rounded-lg p-3">
      <p class="mb-1"><b>🚨 ALERT: Its vs It's (จุดที่พลาดบ่อยที่สุด!)</b></p>
      <p class="mb-1">• <b>its</b> (ไม่มีจุด) = ของมัน → แสดงความเป็นเจ้าของ เช่น <i>The dog wags its tail.</i> (สุนัขส่ายหางของมัน)</p>
      <p class="mb-1">• <b>it's</b> (มีจุด) = it is หรือ it has เช่น <i>It's raining.</i> (ฝนกำลังตก)</p>
      <p class="text-sm text-[var(--brown-mid)]">เคล็ดลับ: ลองแทนคำว่า "it is" ลงไปตรงจุดนั้น ถ้าอ่านแล้วได้ความหมาย ให้ใช้ <b>it's</b> แต่ถ้าอ่านแล้วแปลกๆ ให้ใช้ <b>its</b></p>
    </div>
  `},
  { title: "Grammar File 2: Can & Have got", html: `
    <p class="mb-2"><b>1) Can</b> ใช้บอกความสามารถ (ability) ตามด้วยกริยาช่องที่ 1 เสมอ (V.1 ไม่ผัน ไม่เติม s แม้ประธานจะเป็น he/she/it)</p>
    <div class="bg-white/70 border-2 border-[var(--brown-dark)] rounded-lg p-3 mb-3 text-sm">
      <p>บอกเล่า: ประธาน + can + V.1 → <i>She can swim.</i></p>
      <p>ปฏิเสธ: ประธาน + can't (cannot) + V.1 → <i>He can't cook.</i></p>
      <p>คำถาม: Can + ประธาน + V.1? → <i>Can you drive?</i></p>
      <p>คำตอบสั้น: <i>Yes, I can. / No, I can't.</i></p>
    </div>
    <p class="mb-2"><b>2) Have got</b> แปลว่า "มี" (นิยมใช้ในสำเนียงอังกฤษแบบ British)</p>
    <div class="bg-white/70 border-2 border-[var(--brown-dark)] rounded-lg p-3 mb-3 text-sm">
      <p>I / You / We / They <b>+ have got</b> (ย่อ: 've got)</p>
      <p>He / She / It <b>+ has got</b> (ย่อ: 's got)</p>
      <p>ตัวอย่าง: <i>I've got a new bike. / She's got two brothers.</i></p>
    </div>
    <div class="bg-[var(--stamp-red)]/10 border-2 border-[var(--stamp-red)] rounded-lg p-3">
      <p class="mb-1"><b>🚨 ALERT: คำตอบสั้น (Short Answer)</b></p>
      <p>คำถาม: <i>Have you got a computer?</i></p>
      <p>ตอบถูก ✅ : <i>Yes, I have. / No, I haven't.</i></p>
      <p>ตอบผิด ❌ : <s>Yes, I have got.</s> (ห้ามมีคำว่า got ในคำตอบสั้นเด็ดขาด!)</p>
    </div>
  `},
  { title: "Grammar File 3: Present Simple & Adverbs", html: `
    <p class="mb-2"><b>1) กฎการเติม s/es กับกริยา</b> เมื่อประธานเป็นเอกพจน์ (He/She/It หรือชื่อคนคนเดียว/สิ่งเดียว)</p>
    <table class="w-full text-sm border-collapse mb-3">
      <thead>
        <tr class="bg-[var(--mustard)]">
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">กรณี</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">กฎ</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">ตัวอย่าง</th>
        </tr>
      </thead>
      <tbody>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ส่วนใหญ่</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เติม s</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">play → plays</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">ลงท้าย s, ss, sh, ch, x, o</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เติม es</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">wash → washes, go → goes</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">พยัญชนะ + y</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เปลี่ยน y เป็น ies</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">study → studies</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">สระ + y</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เติม s ปกติ</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">play → plays</td></tr>
      </tbody>
    </table>
    <p class="mb-2"><b>2) Adverbs of Frequency</b> (คำวิเศษณ์บอกความถี่) เรียงจากมากไปน้อย</p>
    <table class="w-full text-sm border-collapse mb-3">
      <thead>
        <tr class="bg-[var(--mustard)]">
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">คำ</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">ความถี่</th>
          <th class="border-2 border-[var(--brown-dark)] px-2 py-1">ความหมาย</th>
        </tr>
      </thead>
      <tbody>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">Always</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">100%</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">เสมอ</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">Usually</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">~90%</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">มักจะ/ส่วนใหญ่</td></tr>
        <tr><td class="border-2 border-[var(--brown-dark)] px-2 py-1">Often</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">~70%</td><td class="border-2 border-[var(--brown-dark)] px-2 py-1">บ่อยๆ</td></tr>

/* ===================== STATE ===================== */

  slideIndex: 0,
  questions: [],
  qIndex: 0,
  streak: 0,
  score: 0,
  selectedOrder: []
};

/* ===================== ELEMENTS ===================== */
const els = {
  phase1: document.getElementById('phase1'),
  phase2: document.getElementById('phase2'),
  phase3: document.getElementById('phase3'),
  slideTitle: document.getElementById('slideTitle'),
  slideBody: document.getElementById('slideBody'),
  dots: document.getElementById('dots'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  startBtn: document.getElementById('startBtn'),
  board: document.getElementById('board'),
  qNum: document.getElementById('qNum'),
  qTotal: document.getElementById('qTotal'),
  streakNum: document.getElementById('streakNum'),
  questionCard: document.getElementById('questionCard'),
  modalOverlay: document.getElementById('modalOverlay'),
  rejectMsg: document.getElementById('rejectMsg'),
  hintBtn: document.getElementById('hintBtn'),
  feedbackText: document.getElementById('feedbackText'),
  retryBtn: document.getElementById('retryBtn'),
  stampEl: document.getElementById('stampEl'),
  finalScore: document.getElementById('finalScore'),
  rebootBtn: document.getElementById('rebootBtn')
};

/* ===================== UTIL ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showPhase(n){
  els.phase1.classList.toggle('hidden-phase', n !== 1);
  els.phase2.classList.toggle('hidden-phase', n !== 2);
  els.phase3.classList.toggle('hidden-phase', n !== 3);
}

/* ===================== PHASE 1: BRIEFING ===================== */
function renderSlide(){
  const s = SLIDES[state.slideIndex];
  els.slideTitle.textContent = s.title;
  els.slideBody.innerHTML = s.html;

  els.dots.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.className = 'w-3 h-3 rounded-full border-2 border-[var(--brown-dark)] ' +
      (i === state.slideIndex ? 'bg-[var(--burnt)]' : 'bg-white');
    els.dots.appendChild(dot);
  });

  els.prevBtn.disabled = state.slideIndex === 0;
  els.prevBtn.classList.toggle('opacity-40', state.slideIndex === 0);

  const isLast = state.slideIndex === SLIDES.length - 1;
  els.nextBtn.classList.toggle('hidden-phase', isLast);
  els.startBtn.classList.toggle('hidden-phase', !isLast);
}

els.prevBtn.addEventListener('click', () => {
  if(state.slideIndex > 0){ state.slideIndex--; renderSlide(); }
});
els.nextBtn.addEventListener('click', () => {
  if(state.slideIndex < SLIDES.length - 1){ state.slideIndex++; renderSlide(); }
});
els.startBtn.addEventListener('click', startSimulation);

/* ===================== PHASE 2: SIMULATION ===================== */
function startSimulation(){
  state.questions = shuffle(QUESTION_BANK).slice(0, 26);
  state.qIndex = 0;
  state.streak = 0;
  state.score = 0;
  els.qTotal.textContent = state.questions.length;
  showPhase(2);
  renderBoard();
  renderQuestion();
}

function renderBoard(){
  els.board.innerHTML = '';
  const total = state.questions.length;
  for(let i = 0; i < total; i++){
    const tile = document.createElement('div');
    let cls = 'w-7 h-7 md:w-8 md:h-8 rounded-md border-2 border-[var(--brown-dark)] flex items-center justify-center text-xs font-type ';
    if(i < state.qIndex){
      cls += 'tile-done text-white';
    } else if(i === state.qIndex){
      cls += 'tile-current';
    } else {
      cls += 'tile-todo';
    }
    tile.className = cls;
    if(i === state.qIndex){
      tile.innerHTML = '<span class="marker-hop">🕵️</span>';
    } else if(i < state.qIndex){
      tile.innerHTML = '✓';
    } else {
      tile.textContent = i + 1;
    }
    els.board.appendChild(tile);
  }
}

function renderQuestion(){
  state.selectedOrder = [];
  const q = state.questions[state.qIndex];
  els.qNum.textContent = state.qIndex + 1;
  els.streakNum.textContent = state.streak;

  let html = '';
  if(q.type === 'fill'){
    html += `<p class="font-thai text-lg text-[var(--brown-dark)] mb-5 whitespace-pre-line">${escapeHtml(q.sentence)}</p>`;
    html += `<div class="flex flex-col gap-3" id="choiceWrap">`;
    q.choices.forEach((c, i) => {
      html += `<button class="brutal-btn choice-btn font-thai text-left bg-white px-4 py-3 rounded-lg" data-choice="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
    });
    html += `</div>`;
  } else if(q.type === 'match'){
    html += `<p class="font-thai text-sm text-[var(--brown-mid)] mb-4">คำสองคำนี้เข้าคู่กันหรือไม่?</p>`;
    html += `<div class="flex items-center justify-center gap-4 mb-6">
      <div class="brutal-sm rounded-lg px-4 py-3 bg-white font-header text-base md:text-lg text-[var(--teal)]">${escapeHtml(q.word1)}</div>
      <span class="font-header text-2xl text-[var(--brown-mid)]">⇄</span>
      <div class="brutal-sm rounded-lg px-4 py-3 bg-white font-header text-base md:text-lg text-[var(--burnt)]">${escapeHtml(q.word2)}</div>
    </div>`;
    html += `<div class="flex gap-3 justify-center">
      <button class="brutal-btn choice-btn font-thai font-bold bg-[var(--teal)] text-white px-6 py-3 rounded-lg" data-choice="MATCH">✅ MATCH</button>
      <button class="brutal-btn choice-btn font-thai font-bold bg-[var(--stamp-red)] text-white px-6 py-3 rounded-lg" data-choice="UNMATCH">❌ UNMATCH</button>
    </div>`;
  } else if(q.type === 'scramble'){
    html += `<p class="font-thai text-sm text-[var(--brown-mid)] mb-2">คำใบ้: ${escapeHtml(q.hint)}</p>`;
    html += `<p class="font-header text-2xl md:text-3xl tracking-[6px] text-[var(--burnt)] text-center mb-5">${escapeHtml(q.scrambled)}</p>`;
    html += `<div class="flex flex-col sm:flex-row gap-3">
      <input id="scrambleInput" type="text" autocomplete="off" placeholder="พิมพ์คำตอบที่นี่..." class="flex-1 brutal-sm rounded-lg px-4 py-3 font-type bg-white" />
      <button id="scrambleSubmit" class="brutal-btn font-thai font-bold bg-[var(--teal)] text-white px-6 py-3 rounded-lg">ส่งคำตอบ</button>
    </div>`;
  } else if(q.type === 'order'){
    html += `<p class="font-thai text-sm text-[var(--brown-mid)] mb-2">คลิกคำตามลำดับให้ถูกต้อง</p>`;
    html += `<div id="orderSelected" class="min-h-[48px] brutal-sm rounded-lg bg-white/80 px-3 py-2 mb-4 flex flex-wrap gap-2 items-center font-type text-sm"></div>`;
    html += `<div id="orderBlocks" class="flex flex-wrap gap-2 mb-5">`;
    q.blocks.forEach(b => {
      html += `<button class="brutal-btn order-block font-thai bg-white px-3 py-2 rounded-lg" data-label="${b.label}">${escapeHtml(b.text)}</button>`;
    });
    html += `</div>`;
    html += `<div class="flex gap-3">
      <button id="orderClear" class="brutal-btn font-thai bg-[var(--manila-dark)] px-4 py-2 rounded-lg text-sm">↺ ล้างลำดับ</button>
      <button id="orderSubmit" class="brutal-btn font-thai font-bold bg-[var(--teal)] text-white px-6 py-2 rounded-lg text-sm">ส่งคำตอบ</button>
    </div>`;
  }

  els.questionCard.innerHTML = html;
  bindQuestionEvents(q);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function bindQuestionEvents(q){
  if(q.type === 'fill' || q.type === 'match'){
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-choice');
        checkAnswer(val === q.correct, q);
      });
    });
  } else if(q.type === 'scramble'){
    const input = document.getElementById('scrambleInput');
    const submit = document.getElementById('scrambleSubmit');
    const doSubmit = () => {
      const val = input.value.trim().toUpperCase().replace(/\s+/g, '');
      checkAnswer(val === q.correct.toUpperCase(), q);
    };
    submit.addEventListener('click', doSubmit);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') doSubmit(); });
  } else if(q.type === 'order'){
    const selectedWrap = document.getElementById('orderSelected');
    const renderSelected = () => {
      if(state.selectedOrder.length === 0){
        selectedWrap.innerHTML = '<span class="text-[var(--brown-mid)] italic">ยังไม่ได้เลือก...</span>';
      } else {
        selectedWrap.innerHTML = state.selectedOrder.map(label => {
          const block = q.blocks.find(b => b.label === label);
          return `<span class="bg-[var(--mustard)] border-2 border-[var(--brown-dark)] rounded px-2 py-1">${escapeHtml(block.text)}</span>`;
        }).join('');
      }
    };
    renderSelected();

    document.querySelectorAll('.order-block').forEach(btn => {
      btn.addEventListener('click', () => {
        const label = btn.getAttribute('data-label');
        if(state.selectedOrder.includes(label)) return;
        state.selectedOrder.push(label);
        btn.disabled = true;
        btn.classList.add('opacity-40');
        renderSelected();
      });
    });

    document.getElementById('orderClear').addEventListener('click', () => {
      state.selectedOrder = [];
      document.querySelectorAll('.order-block').forEach(b => {
        b.disabled = false;
        b.classList.remove('opacity-40');
      });
      renderSelected();
    });

    document.getElementById('orderSubmit').addEventListener('click', () => {
      const isCorrect = state.selectedOrder.length === q.correctOrder.length &&
        state.selectedOrder.every((label, i) => label === q.correctOrder[i]);
      checkAnswer(isCorrect, q);
    });
  }
}

const REJECT_MESSAGES = [
  "ยังไม่ใช่คำตอบที่ถูกต้อง นักสืบ!",
  "เกือบแล้ว... แต่ยังไม่ใช่หลักฐานที่ถูกต้อง",
  "หลักฐานชิ้นนี้ยังไม่ตรงกับคดี ลองอีกครั้ง!",
  "ยังจับผิดจุดไม่ได้ ลองสังเกตดูดีๆ อีกที"
];
let pendingFeedback = '';

function checkAnswer(isCorrect, q){
  if(isCorrect){
    state.streak++;
    state.score++;
    state.qIndex++;
    if(state.qIndex >= state.questions.length){
      completeGame();
    } else {
      renderBoard();
      renderQuestion();
    }
  } else {
    state.streak = 0;
    showRejectedModal(q.feedback);
  }
}

function showRejectedModal(feedback){
  pendingFeedback = feedback;
  els.rejectMsg.textContent = REJECT_MESSAGES[Math.floor(Math.random() * REJECT_MESSAGES.length)];
  els.feedbackText.textContent = feedback;
  els.feedbackText.classList.add('hidden-phase');
  els.hintBtn.classList.remove('hidden-phase');
  els.modalOverlay.classList.remove('hidden-phase');
  els.stampEl.classList.remove('stamp-anim');
  void els.stampEl.offsetWidth;
  els.stampEl.classList.add('stamp-anim');
  els.streakNum.textContent = state.streak;
}

els.hintBtn.addEventListener('click', () => {
  els.feedbackText.classList.remove('hidden-phase');
  els.hintBtn.classList.add('hidden-phase');
});

els.retryBtn.addEventListener('click', () => {
  els.modalOverlay.classList.add('hidden-phase');
  renderQuestion();
});

/* ===================== PHASE 3: MISSION COMPLETE ===================== */
function completeGame(){
  showPhase(3);
  els.finalScore.textContent = `${state.score}/${state.questions.length}`;
  fireConfetti();
}

function fireConfetti(){
  if(typeof confetti !== 'function') return;
  const colors = ['#E3A62F', '#C1440E', '#2A8C82', '#3B2A1E'];
  confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 }, colors });
  setTimeout(() => confetti({ particleCount: 80, angle: 60, spread: 60, origin: { x: 0 }, colors }), 250);
  setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 1 }, colors }), 250);
}

els.rebootBtn.addEventListener('click', () => {
  state.slideIndex = 0;
  showPhase(1);
  renderSlide();
});

/* ===================== INIT ===================== */
renderSlide();
showPhase(1);
</script>
