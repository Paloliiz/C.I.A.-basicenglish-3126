  .btn-ghost { 
    background-color: #f8fafc; color: var(--brown);

  }

  .input-terminal {
    background: #fff; border: 3px solid var(--brown); color: var(--brown);

    box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);

  .fade-in { animation: fadeIn 0.3s ease forwards; }

function attemptLogin() {
  const id = document.getElementById('loginId').value.trim();
  const name = document.getElementById('loginName').value.trim();
  const err = document.getElementById('loginError');
  
  if(!id || !name) { err.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน'; return; }

  if(id === '7238' && name === 'พะโล้') {
    session.id = id; 
    session.name = 'พะโล้';
    session.isAdmin = true;
    session.phase = 'dashboard'; 
    render();
    return;
  }

  if(id.length !== 5 || !studentDB[id]) { err.textContent = 'ไม่พบรหัสนักเรียนในระบบ'; return; }
  if(!studentDB[id].name.includes(name)) { err.textContent = 'ชื่อไม่ตรงกับรหัสนักเรียน'; return; }
  
  session.id = id; 
  session.name = studentDB[id].name;
  session.isAdmin = false;
  session.phase = 'dashboard'; 
  render();
}

        <p class="text-sm font-medium text-brown/70 mt-2">ทำภารกิจแยกแฟ้มคำศัพท์เพื่อจดลงใบงาน (มีการบันทึกคะแนน)</p>
      </div>
    </div>
    <div class="mt-6 text-center">
      <button onclick="logout()" class="btn-ghost px-6 py-2 rounded font-bold text-sm uppercase">Log Out</button>
    </div>
  </div>`;
}

function goToPhase(phase) { session.phase = phase; render(); }
function logout() { session.id = null; session.name = null; session.isAdmin = false; session.phase = 'login'; render(); }

// ---------------- VOCAB DB ----------------
function getVocabHTML() {
  setTimeout(() => renderVocabList(masterVocab), 10);
  return `
  <div class="fade-in">
    <button onclick="goToPhase('dashboard')" class="btn-ghost px-4 py-2 rounded text-sm font-bold mb-4">◄ กลับหน้าหลัก</button>
    <div class="text-center mb-4">
      <h1 class="font-retro text-3xl font-bold text-teal uppercase">Vocab Database</h1>
    </div>
    <input type="text" id="searchInput" onkeyup="filterVocab(this.value)" class="input-terminal w-full rounded-md px-4 py-3 mb-6 font-bold" placeholder="🔍 ค้นหาคำศัพท์ หรือ ความหมายไทย...">
    <div id="vocabContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>`;
}

function renderVocabList(data) {
  const container = document.getElementById('vocabContainer');
  container.innerHTML = data.map(item => `
    <div class="vocab-card flex justify-between items-start">
      <div>
        <h2 class="font-retro text-xl text-teal-dark mb-1">${item.word} <span class="tag-pos ml-1">${item.pos}</span></h2>
        <p class="text-sm font-medium text-brown/70 font-type">${item.eng}</p>
        <p class="text-sm font-bold text-burnt-orange mt-1">${item.thai}</p>
      </div>
      <button class="bg-mustard border-2 border-brown rounded w-10 h-10 flex items-center justify-center font-bold text-lg hover:-translate-y-1 transition-transform shadow-[2px_2px_0px_#451a03]" onclick="speak('${item.word}')">🔊</button>
    </div>
  `).join('');
}
function filterVocab(str) {
  const q = str.toLowerCase();
  const filtered = masterVocab.filter(i => i.word.toLowerCase().includes(q) || i.thai.includes(q) || i.eng.toLowerCase().includes(q));
  renderVocabList(filtered);
}
function speak(text) {
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// ---------------- SORTING GAME ----------------
function startSortingGame() {
  game.queue = [...masterVocab].sort(() => Math.random() - 0.5);
  game.currentIdx = 0; game.errors = 0;
  game.results = { "FACE": [], "HAIR": [], "SPECIAL FEATURES": [], "HEIGHT": [], "BUILD": [], "AGE": [], "CHARACTER": [] };
  session.phase = 'sorting'; render();
}

function getSortingHTML() {
  const w = game.queue[game.currentIdx];
  const currentColors = [...colorPalette].sort(() => Math.random() - 0.5);

  return `
  <div class="fade-in w-full max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-4 font-type font-bold text-sm">
      <div class="bg-white border-2 border-brown px-3 py-1 rounded">EVIDENCE: ${game.currentIdx}/${game.queue.length}</div>
      <div class="bg-mustard border-2 border-brown px-3 py-1 rounded">ERRORS: <span class="text-red-600">${game.errors}</span></div>
    </div>
    <div class="panel p-8 text-center mb-6 bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')] relative" id="wordPanel">
      <p class="text-xs font-bold text-brown/50 tracking-widest uppercase mb-2">Current Evidence</p>
      <h2 class="font-type text-4xl md:text-5xl font-bold text-burnt-orange tracking-wider">${w.word}</h2>
    </div>
    <p class="text-center text-sm font-bold text-brown/70 mb-3 uppercase">Select the correct folder</p>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <button class="btn-folder py-4" style="background-color: ${currentColors[0]}" onclick="checkSort('FACE')">FACE</button>
      <button class="btn-folder py-4" style="background-color: ${currentColors[1]}" onclick="checkSort('HAIR')">HAIR</button>
      <button class="btn-folder py-4" style="background-color: ${currentColors[2]}" onclick="checkSort('SPECIAL FEATURES')">SPECIAL FEATURES</button>
      <button class="btn-folder py-4" style="background-color: ${currentColors[3]}" onclick="checkSort('HEIGHT')">HEIGHT</button>
      <button class="btn-folder py-4" style="background-color: ${currentColors[4]}" onclick="checkSort('BUILD')">BUILD</button>
      <button class="btn-folder py-4" style="background-color: ${currentColors[5]}" onclick="checkSort('AGE')">AGE</button>
      <button class="btn-folder py-4 md:col-span-3 lg:col-span-1" style="background-color: ${currentColors[6]}" onclick="checkSort('CHARACTER')">CHARACTER</button>
    </div>
  </div>`;
}

function checkSort(cat) {
  const w = game.queue[game.currentIdx];
  if (w.cat === cat) {
    // เล่นเสียงตอบถูก
    const sndCorrect = document.getElementById('sfxCorrect');
    sndCorrect.currentTime = 0;
    sndCorrect.play().catch(e => console.log("Audio blocked:", e));

    game.results[cat].push(w.word);
    game.currentIdx++;
    if (game.currentIdx >= game.queue.length) finishSorting();
    else render();
  } else {
    // เล่นเสียงตอบผิด
    const sndWrong = document.getElementById('sfxWrong');
    sndWrong.currentTime = 0;
    sndWrong.play().catch(e => console.log("Audio blocked:", e));

    game.errors++;
    const panel = document.getElementById('wordPanel');
    panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
    render();
  }
}

function finishSorting() {
  fetch(SCRIPT_URL, { 
    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
      studentId: session.id, 
      studentName: session.name, 
      rawScore: game.errors, 
      finalCappedScore: 'Completed', 
      status: 'vocab_sorting_done',
      sheetName: 'คะแนนนักเรียน'
    })
  }).catch(e => console.log('Log error:', e));

  session.phase = 'summary'; render();
  setTimeout(() => {
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#eab308', '#ea580c', '#14b8a6'] });
  }, 100);
}

// ---------------- SUMMARY TABLE ----------------
function getSummaryHTML() {
  let maxRows = 0;
  categories.forEach(c => { if(game.results[c].length > maxRows) maxRows = game.results[c].length; });
  let rows = '';
  for(let i=0; i<maxRows; i++){
    rows += '<tr>' + categories.map(c => `<td>${game.results[c][i] || ''}</td>`).join('') + '</tr>';
  }

  return `
  <div class="fade-in w-full max-w-4xl mx-auto pb-10">
    <div class="panel p-6 bg-white">
      <div class="text-center mb-4">
        <div class="text-5xl mb-2">🏆</div>
        <h2 class="font-retro text-2xl text-teal tracking-widest uppercase">MISSION COMPLETED!</h2>
        <p class="text-sm font-bold text-brown/70 mt-2">นักสืบ ${session.name} ทำภารกิจสำเร็จ (กดผิด ${game.errors} ครั้ง)<br>ระบบได้บันทึกชื่อเรียบร้อยแล้ว ลอกตารางนี้ลงใบงานได้เลยครับ!</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-center bg-manila/30">
          <thead>
            <tr class="bg-mustard text-white">
              <th style="background-color: #3b82f6;">FACE</th>
              <th style="background-color: #ef4444;">HAIR</th>
              <th style="background-color: #8b5cf6;">SPECIAL FEATURES</th>
              <th style="background-color: #ec4899;">HEIGHT</th>
              <th style="background-color: #f59e0b;">BUILD</th>
              <th style="background-color: #d946ef;">AGE</th>
              <th style="background-color: #84cc16;">CHARACTER</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="flex gap-4 mt-6">
        <button onclick="goToPhase('dashboard')" class="btn-ghost flex-1 py-3 font-bold uppercase rounded-lg">Return to HQ</button>
      </div>
    </div>
  </div>`;
}

// ---------------- INIT ----------------
render();
</script>
</body>
</html>
