<style>
  /* 1970s Retro Detective Theme Variables */
  :root {
    --mustard: #eab308;
    --mustard-dark: #ca8a04;
    --burnt-orange: #ea580c;
    --burnt-orange-dark: #c2410c;
    --teal: #14b8a6;
    --teal-dark: #0f766e;
    --brown: #451a03;
    --manila: #fef3c7;
    --manila-dark: #fde68a;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--manila); color: var(--brown); font-family: 'Kanit', sans-serif; min-height: 100vh; overscroll-behavior: none; }
  body { user-select: none; background-image: repeating-linear-gradient(45deg, rgba(69, 26, 3, 0.03) 0px, rgba(69, 26, 3, 0.03) 2px, transparent 2px, transparent 8px); }
  input, textarea { user-select: text; }
  h1, h2, h3, .font-retro { font-family: 'Fredoka', sans-serif; }
  .font-serif { font-family: 'Playfair Display', serif; }

  /* Retro Brutalism UI */
  .panel {
    background-color: #fff;
    border: 4px solid var(--brown);
    border-radius: 12px;
    box-shadow: 8px 8px 0px var(--brown);
  }
  
  .btn-agent {
    font-family: 'Kanit', sans-serif;
    font-weight: 700;
    background-color: var(--teal);
    color: #fff;
    border: 3px solid var(--brown);
    border-radius: 8px;
    box-shadow: 4px 4px 0px var(--brown);
    transition: all 0.1s ease-in-out;
  }
  .btn-agent:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--brown); }
  .btn-agent:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }
  .btn-agent:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); box-shadow: 4px 4px 0px var(--brown) !important; transform: none !important; }

  .btn-danger { background-color: #dc2626; color: #fff; border: 3px solid var(--brown); border-radius: 8px; box-shadow: 4px 4px 0px var(--brown); font-weight: 700; transition: all 0.1s; }
  .btn-danger:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }
  
  .btn-gold { background-color: var(--mustard); color: var(--brown); border: 3px solid var(--brown); border-radius: 8px; box-shadow: 4px 4px 0px var(--brown); font-weight: 700; transition: all 0.1s; }
  .btn-gold:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }

  .btn-ghost { background-color: #f8fafc; color: var(--brown); border: 3px solid var(--brown); border-radius: 8px; box-shadow: 4px 4px 0px var(--brown); font-weight: 700; transition: all 0.1s; }
  .btn-ghost:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }

  .input-terminal {
    background: #fff;
    border: 3px solid var(--brown);
    color: var(--brown);
    font-family: 'Fredoka', sans-serif;
    letter-spacing: 0.1em;
    box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
  }
  .input-terminal:focus { outline: none; border-color: var(--teal); }

  /* Investigation Permits (Lives) */
  .core { font-size: 1.5rem; transition: all 0.3s; }
  .core.dead { opacity: 0.2; filter: grayscale(1); }

  .progress-track { background: var(--manila-dark); border: 2px solid var(--brown); }
  .progress-fill { background: var(--burnt-orange); border-right: 2px solid var(--brown); transition: width .3s ease; }

  /* Choice Buttons */
  .choice-btn { background: #fff; border: 3px solid var(--brown); transition: all .15s ease; text-align: left; box-shadow: 4px 4px 0px rgba(69, 26, 3, 0.15); border-radius: 8px; }
  .choice-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px rgba(69, 26, 3, 0.15); }
  .choice-btn.selected { border-color: var(--teal); background: var(--teal); color: #fff; box-shadow: 4px 4px 0px var(--brown); transform: translate(-2px, -2px); }
  .choice-letter { font-family: 'Fredoka', sans-serif; background: var(--manila-dark); border: 2px solid var(--brown); color: var(--brown); font-weight: bold; }
  .choice-btn.selected .choice-letter { background: #fff; color: var(--teal); border-color: #fff; }

  .modal-backdrop { background: rgba(69, 26, 3, 0.8); backdrop-filter: blur(4px); }
  .fade-in { animation: fadeIn .3s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .timer-critical { color: #dc2626 !important; animation: blinkRed 1s step-start infinite; }
  @keyframes blinkRed { 50% { opacity: 0.5; } }

  .log-row-correct { border-left: 4px solid var(--teal); }
  .log-row-wrong { border-left: 4px solid #dc2626; }

  /* CERTIFICATE PRINT STYLES */
  @media print {
    body * { visibility: hidden; }
    #certOverlay, #certOverlay * { visibility: visible; }
    #certOverlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: white !important; display: flex; align-items: center; justify-content: center; padding: 0; }
    .no-print { display: none !important; }
    #certificateNode { box-shadow: none !important; transform: scale(1) !important; width: 100% !important; height: auto !important; max-width: none !important; }
  }
</style>

// ---------- STORAGE HELPERS ----------
function storageKey(id){ return `mia_m3_state_${id}`; }
function loadState(id){ try{ const raw = localStorage.getItem(storageKey(id)); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; } }
function saveState(id, state){ try{ localStorage.setItem(storageKey(id), JSON.stringify(state)); }catch(e){} }
function defaultState(){ return { lives: MAX_LIVES, cooldownEnd: null, status: 'active', lastScoreDisplay: null }; }

function showCustomModal(icon, title, message, callback, opts = {}){
  const root = document.getElementById('modalRoot');
  const confirmMode = !!opts.confirm;
  const confirmText = opts.confirmText || 'ACKNOWLEDGE';
  const cancelText = opts.cancelText || 'ABORT';
  const dangerConfirm = !!opts.danger;

  root.innerHTML = `
    <div class="fixed inset-0 z-[100] modal-backdrop flex items-center justify-center p-4 fade-in">
      <div class="panel max-w-md w-full p-6 relative">
        <div class="flex flex-col items-center text-center gap-3 w-full">
          <div class="text-5xl font-retro">${icon}</div>

          <p class="text-sm font-medium leading-relaxed whitespace-pre-line text-brown/80">${message}</p>
          <div class="flex gap-3 mt-4 w-full">
            ${confirmMode ? `<button id="modalCancelBtn" class="btn-ghost flex-1 py-3 rounded-md text-sm tracking-wide">${cancelText}</button>` : ''}
            <button id="modalOkBtn" class="${dangerConfirm ? 'btn-danger' : 'btn-agent'} flex-1 py-3 rounded-md text-sm tracking-wide uppercase">${confirmText}</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalOkBtn').onclick = () => { root.innerHTML = ''; if(callback) callback(true); };
  if(confirmMode){ document.getElementById('modalCancelBtn').onclick = () => { root.innerHTML = ''; if(callback) callback(false); }; }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

// ---------- UTIL ----------
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function fireConfetti(){
  const duration = 2500;
  const end = Date.now() + duration;
  const colors = ['#eab308', '#ea580c', '#14b8a6', '#451a03'];
  (function frame(){
    confetti({ particleCount: 4, angle: 60, spread: 65, origin: {x:0}, colors: colors });
    confetti({ particleCount: 4, angle: 120, spread: 65, origin: {x:1}, colors: colors });
    if(Date.now() < end) requestAnimationFrame(frame);
  })();
  confetti({ particleCount: 140, spread: 100, origin: {y:0.5}, colors: colors });
}

  dispName = dispName.replace('เด็กหญิง', 'Miss ').replace('เด็กชาย', 'Mr. ').replace('นางสาว', 'Miss ').replace('นาย', 'Mr. ');

// ---------- RENDER ROOT ----------
function render(){
  const app = document.getElementById('app');
  
  // ดัก In-app Browser ทันทีที่โหลด
  if(isInAppBrowser()){ app.innerHTML = renderBlocked(); return; }

  switch(session.phase){
    case 'login': app.innerHTML = renderLogin(); attachLoginEvents(); break;
    case 'dashboard': app.innerHTML = renderDashboard(); attachDashboardEvents(); startDashboardTicker(); break;
    case 'exam': app.innerHTML = renderExam(); attachExamEvents(); break;
    case 'result': app.innerHTML = renderResult(); attachResultEvents(); break;
    default: app.innerHTML = renderLogin(); attachLoginEvents();
  }
}

function attachLoginEvents(){
  const btn = document.getElementById('loginBtn');
  const idInput = document.getElementById('loginId');
  const nameInput = document.getElementById('loginName');
  const err = document.getElementById('loginError');

  idInput.addEventListener('input', () => { idInput.value = idInput.value.replace(/[^0-9]/g,'').slice(0,5); });

  const attempt = () => {
    const id = idInput.value.trim();
    const name = nameInput.value.trim();
    err.textContent = '';
    if(!id || !name){ err.textContent = 'ERROR: Badge Number and Name are required.'; return; }
    if(id === ADMIN_ID && name === ADMIN_FIRSTNAME){
      session.studentId = id; session.studentName = 'DIRECTOR'; session.isAdmin = true;
      let st = loadState(id) || defaultState(); st.lives = MAX_LIVES; st.cooldownEnd = null; st.status = 'active'; saveState(id, st);
      session.phase = 'dashboard'; render(); return;
    }
    if(id.length !== 5 || !studentDB.hasOwnProperty(id)){ err.textContent = 'ACCESS DENIED: Badge Number not found in database.'; return; }
    const record = studentDB[id];
    if(!record.name.includes(name)){ err.textContent = 'ACCESS DENIED: Name does not match records.'; return; }
    
    session.studentId = id; session.studentName = record.name; session.isAdmin = false;
    let st = loadState(id);
    
    if(!st) st = defaultState();
    
    if(record.passedMidterm && st.status !== 'passed'){
      st.status = 'passed';
      // หารคะแนนดิบ 2 ปัดเศษขึ้น เพื่อให้แสดงคะแนนเต็ม 20
      const pointEarned = Math.ceil(record.score / 2);
      st.lastScoreDisplay = pointEarned + ' / 20 (MIDTERM EXAM)';
      st.lives = MAX_LIVES; 
      st.cooldownEnd = null;
    }
    saveState(id, st);
    
    session.phase = 'dashboard'; render();
  };
  btn.addEventListener('click', attempt);
  nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') attempt(); });
  idInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') attempt(); });
}

function attachDashboardEvents(){
  const initBtn = document.getElementById('initiateBtn');
  if(initBtn){
    initBtn.addEventListener('click', () => {
      showCustomModal('📁', 'OPEN CONFIDENTIAL FILE', `You are about to start the investigation.\n\n${TOTAL_QUESTIONS} Questions · 40:00 Minutes\nTarget Score: 19/40\n\nOnce opened, the timer cannot be paused.`, (confirmed) => {

      }, { confirm:true, confirmText:'START EXAM', cancelText:'CANCEL' });
    });
  }
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', () => {
      if(dashboardTimerHandle) clearInterval(dashboardTimerHandle);
      session.studentId = null; session.studentName = null; session.isAdmin = false; session.phase = 'login'; render();
    });
  }
}

function startDashboardTicker(){
  if(dashboardTimerHandle) clearInterval(dashboardTimerHandle);
  const timerEl = document.getElementById('cooldownTimer');
  if(!timerEl) return;
  const tick = () => {
    const st = currentStudentState(); const now = Date.now();
    const remaining = Math.max(0, Math.floor((st.cooldownEnd - now)/1000));
    const el = document.getElementById('cooldownTimer');
    if(!el){ clearInterval(dashboardTimerHandle); return; }
    el.textContent = fmtTime(remaining);
    if(remaining <= 0){ clearInterval(dashboardTimerHandle); render(); }
  };
  tick(); dashboardTimerHandle = setInterval(tick, 1000);
}

// ================= PHASE: EXAM =================
function startExam(){
  examRuntime = { answers: new Array(examData.length).fill(null), currentQ: 0, timeLeft: EXAM_TIME_LIMIT_SEC, timerHandle: null, lastResult: null };
  session.phase = 'exam'; render();
}

function renderExam(){
  const q = examData[examRuntime.currentQ]; const total = examData.length;
  const progressPct = Math.round(((examRuntime.currentQ) / total) * 100);
  const selected = examRuntime.answers[examRuntime.currentQ];
  const choicesHtml = q.choices.map((c, i) => `<button data-idx="${i}" class="choice-btn w-full flex items-center gap-3 px-4 py-3 mb-3 ${selected === i ? 'selected' : ''}"><span class="choice-letter w-8 h-8 flex items-center justify-center rounded-sm text-sm flex-shrink-0">${String.fromCharCode(65+i)}</span><span class="text-sm font-medium">${c}</span></button>`).join('');

  return `
  <div class="w-full max-w-2xl mt-4 fade-in pb-10">
    <div class="flex items-center justify-between mb-2">
      <div class="font-retro text-sm text-burnt-orange tracking-widest uppercase">Clue ${examRuntime.currentQ+1} / ${total}</div>
      <div id="examTimer" class="font-retro text-xl text-teal-dark tracking-widest">${fmtTime(examRuntime.timeLeft)}</div>
    </div>
    <div class="progress-track rounded-full h-2.5 mb-6 overflow-hidden"><div class="progress-fill h-full rounded-full" style="width:${progressPct}%"></div></div>
    
    <div class="panel p-6 mb-5 min-h-[120px] bg-white">
      <p class="text-base md:text-lg font-medium leading-relaxed whitespace-pre-line text-brown">${q.q}</p>
    </div>
    
    <div id="choicesWrap">${choicesHtml}</div>
    
    <div class="flex gap-2 mt-6">
      <button id="prevBtn" ${examRuntime.currentQ === 0 ? 'disabled' : ''} class="btn-ghost flex-1 py-3 rounded-md text-xs md:text-sm tracking-widest uppercase">◄ Back</button>
      <button id="overviewBtn" class="btn-ghost flex-1 py-3 rounded-md text-xs md:text-sm tracking-widest uppercase text-teal-dark">📂 Folder</button>
      ${examRuntime.currentQ === total - 1 ? `<button id="submitBtn" class="btn-agent flex-1 py-3 rounded-md text-xs md:text-sm tracking-widest uppercase">Close Case ✔</button>` : `<button id="nextBtn" class="btn-agent flex-1 py-3 rounded-md text-xs md:text-sm tracking-widest uppercase">Next ►</button>`}
    </div>
  </div>`;
}

function attachExamEvents(){
  const wrap = document.getElementById('choicesWrap');
  wrap.querySelectorAll('.choice-btn').forEach(btn => { btn.addEventListener('click', () => { const idx = parseInt(btn.getAttribute('data-idx'), 10); examRuntime.answers[examRuntime.currentQ] = idx; wrap.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }); });
  
  const prevBtn = document.getElementById('prevBtn'); if(prevBtn) prevBtn.addEventListener('click', () => { if(examRuntime.currentQ > 0){ examRuntime.currentQ--; updateExamViewOnly(); } });
  const nextBtn = document.getElementById('nextBtn'); if(nextBtn) nextBtn.addEventListener('click', () => { if(examRuntime.currentQ < examData.length - 1){ examRuntime.currentQ++; updateExamViewOnly(); } });
  const submitBtn = document.getElementById('submitBtn'); if(submitBtn) submitBtn.addEventListener('click', () => { const unanswered = examRuntime.answers.filter(a => a === null).length; showCustomModal('📤', 'SUBMIT EVIDENCE', unanswered > 0 ? `You have ${unanswered} missing clues.\nSubmit the case anyway?` : `All clues collected.\nClose this case now?`, (confirmed) => { if(confirmed) finishExam('submitted'); }, { confirm:true, confirmText:'SUBMIT', cancelText:'REVIEW' }); });
  const overviewBtn = document.getElementById('overviewBtn'); if(overviewBtn) overviewBtn.addEventListener('click', showOverviewModal);
  
  startExamTimer();
}

function updateExamViewOnly(){ const app = document.getElementById('app'); app.innerHTML = renderExam(); attachExamEventsNoTimer(); }

function attachExamEventsNoTimer(){
  const wrap = document.getElementById('choicesWrap');
  wrap.querySelectorAll('.choice-btn').forEach(btn => { btn.addEventListener('click', () => { const idx = parseInt(btn.getAttribute('data-idx'), 10); examRuntime.answers[examRuntime.currentQ] = idx; wrap.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); }); });
  
  const prevBtn = document.getElementById('prevBtn'); if(prevBtn) prevBtn.addEventListener('click', () => { if(examRuntime.currentQ > 0){ examRuntime.currentQ--; updateExamViewOnly(); } });
  const nextBtn = document.getElementById('nextBtn'); if(nextBtn) nextBtn.addEventListener('click', () => { if(examRuntime.currentQ < examData.length - 1){ examRuntime.currentQ++; updateExamViewOnly(); } });
  const submitBtn = document.getElementById('submitBtn'); if(submitBtn) submitBtn.addEventListener('click', () => { const unanswered = examRuntime.answers.filter(a => a === null).length; showCustomModal('📤', 'SUBMIT EVIDENCE', unanswered > 0 ? `You have ${unanswered} missing clues.\nSubmit the case anyway?` : `All clues collected.\nClose this case now?`, (confirmed) => { if(confirmed) finishExam('submitted'); }, { confirm:true, confirmText:'SUBMIT', cancelText:'REVIEW' }); });
  const overviewBtn = document.getElementById('overviewBtn'); if(overviewBtn) overviewBtn.addEventListener('click', showOverviewModal);
  
  syncExamTimerDisplay();
}

function startExamTimer(){
  if(examRuntime.timerHandle) clearInterval(examRuntime.timerHandle);
  examRuntime.timerHandle = setInterval(() => {
    examRuntime.timeLeft--; syncExamTimerDisplay();
    if(examRuntime.timeLeft <= 0){ clearInterval(examRuntime.timerHandle); finishExam('timeout'); }
  }, 1000);
}
function syncExamTimerDisplay(){
  const el = document.getElementById('examTimer'); if(!el) return;
  el.textContent = fmtTime(examRuntime.timeLeft);
  if(examRuntime.timeLeft <= 60) el.classList.add('timer-critical');
}

// ---------- SCORING & SUBMISSION ----------
function finishExam(reason){
  if(examRuntime.timerHandle) clearInterval(examRuntime.timerHandle);
  closeModal();

  let raw = 0;
  const logs = examData.map((q, i) => {
    const userAns = examRuntime.answers[i];
    const correct = userAns === q.ans;
    if(correct) raw++;
    return { q: q.q, choices: q.choices, userAns, correctAns: q.ans, correct, exp: q.exp };
  });

  const passed = raw >= PASS_RAW_SCORE;
  let st = currentStudentState();
  let coresLeft = session.isAdmin ? MAX_LIVES : st.lives;
  let statusOut = 'active';
  let finalScoreDisplay;

  if(passed){
    finalScoreDisplay = CAPPED_PASS_SCORE; statusOut = 'passed';
    if(!session.isAdmin){ st.status = 'passed'; st.lastScoreDisplay = finalScoreDisplay; st.cooldownEnd = null; saveState(session.studentId, st); }
  } else {
    finalScoreDisplay = `${raw} / ${TOTAL_QUESTIONS} (FAILED)`;
    if(!session.isAdmin){
      st.lives = Math.max(0, st.lives - 1); coresLeft = st.lives;
      if(st.lives <= 0){ st.status = 'locked'; st.cooldownEnd = null; statusOut = 'locked'; }
      else { st.status = 'active'; st.cooldownEnd = Date.now() + COOLDOWN_SEC * 1000; statusOut = 'cooldown'; }
      saveState(session.studentId, st);
    } else { statusOut = 'admin_fail_ignored'; }
  }

  examRuntime.lastResult = { raw, passed, reason, logs, finalScoreDisplay, coresLeft, statusOut, submittedAt: new Date().toISOString() };

  if(SCRIPT_URL && SCRIPT_URL !== 'YOUR_GOOGLE_SCRIPT_URL_HERE'){
    fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentId: session.studentId, studentName: session.studentName, rawScore: raw, finalCappedScore: passed ? CAPPED_PASS_SCORE : `${raw} / ${TOTAL_QUESTIONS}`, coresLeft: coresLeft, status: statusOut })
    }).catch(err => console.error('[MIA] Failed to submit result:', err));
  }

  session.phase = 'result';
  render();
  
  if(passed) fireConfetti(); 
}

// ================= PHASE: RESULT =================
function renderResult(){
  const r = examRuntime.lastResult;
  if(!r){ session.phase = 'dashboard'; return renderDashboard(); }

  const reasonNote = { submitted: '', timeout: '<p class="text-xs font-bold text-red-600 mt-2 uppercase">⏱ Time Expired (Auto-Submit)</p>' }[r.reason] || '';

  let mainBlock;
  if(r.passed){
    mainBlock = `
      <div class="text-center py-4">
        <div class="text-6xl mb-3 font-retro">🏆</div>
        <h2 class="font-retro text-2xl md:text-3xl text-teal-dark tracking-widest mb-2 uppercase">CASE CLOSED SUCCESSFULLY</h2>
        <p class="text-sm font-medium text-brown/60 mb-4">Final Evaluation Score</p>
        <div class="font-retro text-5xl text-teal-dark tracking-wider mb-2 drop-shadow-sm">${CAPPED_PASS_SCORE}</div>
        <p class="text-xs font-bold text-brown/50 mb-6 uppercase">(Raw performance: ${r.raw} / ${TOTAL_QUESTIONS})</p>
        <div class="flex justify-center mt-4 border-t-2 border-brown/20 pt-6">
          <button onclick="openCert('retest')" class="btn-agent w-full py-4 rounded-md font-retro text-lg tracking-widest uppercase">Print License ➔</button>
        </div>
        ${reasonNote}
      </div>`;
  } else {
    const lockedNow = r.statusOut === 'locked';
    mainBlock = `
      <div class="text-center py-4">
        <div class="text-6xl mb-3 font-retro">${lockedNow ? '🚨' : '❌'}</div>
        <h2 class="font-retro text-2xl md:text-3xl text-red-600 tracking-widest mb-2 uppercase">${lockedNow ? 'LICENSE REVOKED' : 'INVESTIGATION FAILED'}</h2>
        <p class="text-sm font-medium text-brown/70 mb-1">Score: <span class="text-red-600 font-bold">${r.raw} / ${TOTAL_QUESTIONS}</span> (Target: 19)</p>
        <p class="text-xs font-bold text-brown/50 mb-3 uppercase">1 Permit Confiscated</p>
        <div class="flex gap-2 justify-center mb-4">${renderCores(r.coresLeft)}</div>
        ${lockedNow ? '<p class="text-xs text-red-600 font-bold tracking-wide mt-2 uppercase">CONTACT CHIEF (T. Ploy) IMMEDIATELY.</p>' : '<p class="text-xs font-bold text-burnt-orange mt-2 uppercase">System will enter 15:00 cooldown before retry.</p>'}
        ${reasonNote}
      </div>`;
  }

  return `
  <div class="w-full max-w-2xl mt-4 fade-in pb-10">
    <div class="panel p-6 md:p-8 mb-5">
      ${mainBlock}
    </div>
    <div class="flex gap-3">
      <button id="viewLogsBtn" class="btn-ghost flex-1 py-3 rounded-md text-sm font-bold tracking-widest uppercase text-teal-dark">📋 View Case Logs</button>
      <button id="backToDashBtn" class="btn-agent flex-1 py-3 rounded-md text-sm font-bold tracking-widest uppercase">Return to HQ</button>
    </div>
    <div id="logsPanel" class="mt-5 hidden"></div>
  </div>`;
}

function attachResultEvents(){
  const backBtn = document.getElementById('backToDashBtn'); backBtn.addEventListener('click', () => { session.phase = 'dashboard'; render(); });
  const logsBtn = document.getElementById('viewLogsBtn');
  logsBtn.addEventListener('click', () => {
    const panel = document.getElementById('logsPanel');
    if(panel.classList.contains('hidden')){ panel.innerHTML = renderLogs(); panel.classList.remove('hidden'); logsBtn.textContent = '📋 HIDE LOGS'; }
    else { panel.classList.add('hidden'); panel.innerHTML = ''; logsBtn.textContent = '📋 VIEW CASE LOGS'; }
  });
}

function renderLogs(){
  const r = examRuntime.lastResult;
  const rows = r.logs.map((entry, i) => {
    const userLabel = entry.userAns === null ? '<span class="text-red-600 font-bold italic">No answer</span>' : `${String.fromCharCode(65+entry.userAns)}. ${entry.choices[entry.userAns]}`;
    let extra = '';
    if(!entry.correct){
      if(session.isAdmin){ extra = `<p class="text-sm text-teal-dark font-bold mt-2">Correct: ${String.fromCharCode(65+entry.correctAns)}. ${entry.choices[entry.correctAns]}</p>`; }
      else { extra = `<p class="text-sm text-burnt-orange font-bold mt-2 bg-manila-dark p-2 rounded-md">💡 Detective Hint: ${entry.exp}</p>`; }
    }
    return `<div class="${entry.correct ? 'log-row-correct' : 'log-row-wrong'} bg-white border-2 border-brown/20 rounded-md p-4 mb-3 shadow-sm"><p class="text-xs font-bold text-brown/60 mb-2 uppercase">Clue ${i+1}</p><div class="text-sm font-medium text-brown mb-3 whitespace-pre-line">${entry.q}</div><p class="text-sm font-medium text-brown/80 bg-gray-50 p-2 rounded border border-gray-200">Your answer: ${userLabel} ${entry.correct ? '<span class="text-teal font-bold ml-2">✔ CORRECT</span>' : '<span class="text-red-600 font-bold ml-2">✘ INCORRECT</span>'}</p>${extra}</div>`;
  }).join('');
  return `<div class="panel p-4 max-h-[500px] overflow-y-auto bg-manila"><h3 class="font-retro text-base text-teal-dark tracking-wide mb-4 border-b-2 border-brown/20 pb-2 uppercase">EVIDENCE REVIEW ${session.isAdmin ? '(ADMIN MODE)' : ''}</h3>${rows}</div>`;
}

// ---------- INIT ----------
render();
</script>
</body>
</html>
