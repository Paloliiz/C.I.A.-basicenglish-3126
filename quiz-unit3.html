<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.I.A. Mission: Unit 3 Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================= 1970s Retro Detective Theme ================= */
        :root {
            --mustard: #eab308;
            --mustard-dark: #ca8a04;
            --burnt-orange: #ea580c;
            --burnt-orange-dark: #c2410c;
            --teal: #14b8a6;
            --teal-dark: #0f766e;
            --brown: #451a03;
            --manila: #fef3c7;
            --manila-dark: #fde68a;
        }

        * { -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--manila);
            color: var(--brown);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: repeating-linear-gradient(45deg, rgba(69, 26, 3, 0.03) 0px, rgba(69, 26, 3, 0.03) 2px, transparent 2px, transparent 8px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .font-retro { font-family: 'Fredoka', sans-serif; }

        .container-box {
            width: 100%;
            max-width: 600px;
            margin: 20px;
        }

        .panel {
            background-color: #fff;
            border: 4px solid var(--brown);
            border-radius: 12px;
            box-shadow: 8px 8px 0px var(--brown);
            padding: 30px;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Typography & Inputs */
        .input-terminal {
            background: #fff;
            border: 3px solid var(--brown);
            color: var(--brown);
            font-family: 'Kanit', sans-serif;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .input-terminal:focus { outline: none; border-color: var(--teal); }
        .input-id { font-family: 'Fredoka', sans-serif; letter-spacing: 0.2em; }

        /* Buttons */
        .btn-agent {
            background-color: var(--teal);
            color: #fff;
            border: 3px solid var(--brown);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--brown);
            font-weight: 700;
            transition: all 0.1s ease-in-out;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
        }
        .btn-agent:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--brown); }
        .btn-agent:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }
        .btn-agent:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); box-shadow: 4px 4px 0px var(--brown) !important; transform: none !important; }

        .btn-warning {
            background-color: var(--mustard);
            color: var(--brown);
            border: 3px solid var(--brown);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--brown);
            font-weight: 700;
            transition: all 0.1s;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
        }
        .btn-warning:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }

        .btn-danger {
            background-color: #dc2626;
            color: #fff;
            border: 3px solid var(--brown);
            border-radius: 8px;
            box-shadow: 4px 4px 0px var(--brown);
            font-weight: 700;
            transition: all 0.1s;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
        }
        .btn-danger:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--brown); }

        /* Quiz UI */
        .status-bar {
            background: var(--manila-dark);
            border: 2px solid var(--brown);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .timer-warning { color: #dc2626 !important; animation: blinkRed 1s step-start infinite; }
        @keyframes blinkRed { 50% { opacity: 0.5; } }

        .question-box {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.6;
            color: var(--brown);
        }

        .options-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            color: var(--brown);
            border: 3px solid var(--brown);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            font-family: 'Kanit', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(69, 26, 3, 0.15);
            transition: all .15s ease;
        }
        .option-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(69, 26, 3, 0.15);
            border-color: var(--teal-dark);
        }
        .option-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(69, 26, 3, 0.15);
        }
        .option-btn.selected {
            background-color: var(--teal);
            color: #fff;
            border-color: var(--brown);
            box-shadow: 4px 4px 0px var(--brown);
            transform: translate(-2px, -2px);
            font-weight: 700;
        }

        /* Result UI */
        .result-details {
            background-color: var(--manila);
            border: 2px solid var(--brown);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>

            </div>

            <!-- 2. Quiz Screen -->

            { q: "You wear a ____________ on your head to protect it from injuries.", options: ["helmet", "mask", "goggles", "pads"], a: "helmet" },
            { q: "You wear ____________ on your knees and elbows to protect them when you fall.", options: ["pads", "flippers", "goggles", "masks"], a: "pads" },
            { q: "You wear ____________ over your eyes to see underwater.", options: ["goggles", "flippers", "pads", "gloves"], a: "goggles" },
            { q: "You need a ____________ to play cricket or baseball.", options: ["bat", "racquet", "paddle", "snowboard"], a: "bat" },
            { q: "You wear a ____________ over your face when snorkelling to see clearly and breathe.", options: ["mask", "helmet", "goggles", "pad"], a: "mask" },
            { q: "You need a ____________ to go snowboarding in the mountains.", options: ["snowboard", "paddle", "bat", "racquet"], a: "snowboard" },
            
            // Q21-30: Holiday Problems
            { q: "\"Oh, no! I can't travel to Dubai without it!\" What is the problem?", options: ["lose passport", "get sunburnt", "get a puncture", "car break down"], a: "lose passport" },
            { q: "\"It happened while I was on the bus. Someone took it from my pocket!\" What is the problem?", options: ["steal a wallet", "miss a flight", "lose luggage", "get a flat tyre"], a: "steal a wallet" },
            { q: "\"Don't worry! We'll catch the next one!\" What is the problem?", options: ["miss a flight", "get sunburnt", "lose passport", "steal a wallet"], a: "miss a flight" },
            { q: "\"Don't touch me! It hurts! Just take me to a doctor please!\" What is the problem?", options: ["get sunburnt", "miss a flight", "lose luggage", "car break down"], a: "get sunburnt" },
            { q: "\"All my clothes and even my laptop were in there! What am I going to do now?!\" What is the problem?", options: ["lose luggage", "steal a wallet", "get a puncture", "miss a flight"], a: "lose luggage" },
            { q: "\"We've got a spare tyre in the boot of the car!\" What is the problem?", options: ["get a flat tyre", "lose luggage", "steal a wallet", "miss a flight"], a: "get a flat tyre" },
            { q: "The engine suddenly stopped working while we were driving. The problem is ____________.", options: ["car break down", "get a puncture", "get sunburnt", "lose passport"], a: "car break down" },
            { q: "When your car gets a puncture, it means you ____________.", options: ["get a flat tyre", "miss a flight", "steal a wallet", "lose luggage"], a: "get a flat tyre" },
            { q: "If you stay in the sun for too long without protection, you might ____________.", options: ["get sunburnt", "lose passport", "miss a flight", "steal a wallet"], a: "get sunburnt" },
            { q: "If you arrive at the airport too late, you will ____________.", options: ["miss a flight", "lose luggage", "get a flat tyre", "car break down"], a: "miss a flight" }
        ];

        // =========================================================
        // 4. ตัวแปรสำหรับควบคุมระบบ (State Variables)
        // =========================================================
        let currentStudent = null;
        let currentStudentId = null;
        let attemptCount = 1;

        let quizPool = [];
        let currentQIndex = 0;
        let userAnswers = [];
        let score = 0;

        let timeLeft = 30 * 60; // 30 นาที (1800 วินาที)
        let timerInterval;
        let cheatWarnings = 0;

        // =========================================================
        // 5. ระบบล็อคอินและการจัดการนักเรียน
        // =========================================================
        function checkLogin() {
            const idInput = document.getElementById("student-id").value.trim();
            const nameInput = document.getElementById("student-name").value.trim();

            if (idInput.length !== 5) {
                alert("กรุณากรอกรหัสนักเรียน 5 หลักให้ครบถ้วน");
                return;
            }
            if (nameInput === "") {
                alert("กรุณากรอกชื่อจริง (ไม่ต้องใส่ ด.ช./ด.ญ.)");
                return;
            }
            
            // ตรวจสอบรหัสแอดมิน (ครูพะโล้)
            if (idInput === ADMIN_ID && nameInput === ADMIN_FIRSTNAME) {
                currentStudent = { name: "ครูพะโล้ (Admin)", room: "Staff", number: 0 };
                currentStudentId = ADMIN_ID;
                document.getElementById("student-name-display").innerText = `CHIEF INSPECTOR: ${currentStudent.name}`;
                document.getElementById("confirm-box").classList.remove("hidden");
                document.getElementById("btn-login").classList.add("hidden");
                document.getElementById("btn-teacher-reset").classList.remove("hidden");
                return;
            }

            if (studentDB[idInput]) {
                const record = studentDB[idInput];

                if (!record.name.includes(nameInput)) {
                    alert("รหัสผ่านหรือชื่อไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง (ใส่แค่ชื่อจริง ไม่ต้องมีคำนำหน้า)");
                    return;
                }

                currentStudent = record;
                currentStudentId = idInput;
                document.getElementById("student-name-display").innerText = `${currentStudent.name} (${currentStudent.room} เลขที่ ${currentStudent.number})`;
                document.getElementById("confirm-box").classList.remove("hidden");
                document.getElementById("btn-login").classList.add("hidden");
                document.getElementById("btn-teacher-reset").classList.add("hidden");

            } else {
                alert("ไม่พบรหัสนักเรียนนี้ในระบบ กรุณาตรวจสอบอีกครั้ง");
            }
        }

        // ฟังก์ชันพิเศษสำหรับครู (เคลียร์ความจำเบราว์เซอร์)
        function resetTeacher() {
            localStorage.removeItem('M3_Unit3_Attempts_' + ADMIN_ID);
            alert("ล้างประวัติการสอบของแอดมินเรียบร้อยแล้ว!");
        }

        function resetLogin() {
            document.getElementById("student-id").value = "";
            document.getElementById("student-name").value = "";
            document.getElementById("confirm-box").classList.add("hidden");
            document.getElementById("btn-login").classList.remove("hidden");
            currentStudent = null;
            currentStudentId = null;
        }

        // =========================================================
        // 6. เริ่มทำข้อสอบ
        // =========================================================
        function startExam() {
            let savedAttempt = localStorage.getItem('M3_Unit3_Attempts_' + currentStudentId);
            if (savedAttempt) {
                attemptCount = parseInt(savedAttempt) + 1;
            } else {
                attemptCount = 1;
            }

            quizPool = shuffleArray([...rawQuestions]).map(q => {
                let shuffledOptions = shuffleArray([...q.options]);
                return { ...q, options: shuffledOptions };
            });

            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            
            enableAntiCheat();
            startTimer();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= quizPool.length) {
                finishExam();
                return;
            }

            let qData = quizPool[currentQIndex];
            document.getElementById("question-counter").innerText = `Clue: ${currentQIndex + 1} / 30`;
            document.getElementById("question-text").innerText = qData.q;
            
            let optionsHtml = "";
            qData.options.forEach((opt, idx) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(this, ${idx})">${opt}</button>`;
            });
            
            document.getElementById("options-area").innerHTML = optionsHtml;
            document.getElementById("btn-next").disabled = true;
        }

        function selectOption(btnElement, selectedIndex) {
            let allBtns = document.querySelectorAll(".option-btn");
            allBtns.forEach(btn => btn.classList.remove("selected"));
            btnElement.classList.add("selected");
            
            userAnswers[currentQIndex] = quizPool[currentQIndex].options[selectedIndex];
            document.getElementById("btn-next").disabled = false;
        }
        
        function nextQuestion() {
            currentQIndex++;
            loadQuestion();
        }

        // =========================================================
        // 7. ระบบจับเวลา
        // =========================================================
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                let tDisplay = document.getElementById("time-display");
                tDisplay.innerText = `${m}:${s}`;
                
                if (timeLeft <= 300) tDisplay.classList.add("timer-warning");
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("หมดเวลาทำข้อสอบ! ระบบจะส่งคำตอบอัตโนมัติ");
                    finishExam();
                }
            }, 1000);
        }

        // =========================================================
        // 8. ประมวลผลและคิดคะแนน (Decay Multiplier)
        // =========================================================
        function finishExam() {
            clearInterval(timerInterval);
            disableAntiCheat();
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            score = 0;
            quizPool.forEach((q, idx) => {
                if (userAnswers[idx] === q.a) score++;
            });

            document.getElementById("final-score").innerText = score;
            document.getElementById("res-name").innerText = `${currentStudent.name}`;
            document.getElementById("res-attempt").innerText = attemptCount;

            let actionsHtml = "";
            
            if (score >= 21) {
                document.getElementById("result-title").innerText = "MISSION ACCOMPLISHED!";
                document.getElementById("result-title").style.color = "var(--teal-dark)";
                document.getElementById("result-icon").innerText = "🏆";
                
                let netScore = score;
                let decayMsg = "";
                
                if (attemptCount === 2) {
                    netScore = Math.round(score * 0.9);
                    decayMsg = "สอบผ่านในรอบที่ 2 (รับคะแนน 90%)";
                } else if (attemptCount === 3) {
                    netScore = Math.round(score * 0.8);
                    decayMsg = "สอบผ่านในรอบที่ 3 (รับคะแนน 80%)";
                } else if (attemptCount >= 4) {
                    netScore = 21;
                    decayMsg = "สอบผ่านในรอบที่ 4 ขึ้นไป (รับคะแนนผ่านเกณฑ์ขั้นต่ำ)";
                } else {
                    decayMsg = "สอบผ่านในรอบที่ 1 (รับคะแนนเต็ม 100%)";
                }

                document.getElementById("decay-warning").innerText = decayMsg;
                actionsHtml = `<button class="btn-agent uppercase tracking-widest text-lg" onclick="submitToGoogleSheets(${score}, ${netScore})">Submit Evidence ➔</button>`;
                
            } else {
                document.getElementById("result-title").innerText = "MISSION FAILED!";
                document.getElementById("result-title").style.color = "#dc2626";
                document.getElementById("result-icon").innerText = "❌";
                
                localStorage.setItem('M3_Unit3_Attempts_' + currentStudentId, attemptCount);
                actionsHtml = `<button class="btn-warning uppercase tracking-widest" onclick="location.reload()">Review & Retry Mission</button>`;
            }
            
            document.getElementById("action-buttons").innerHTML = actionsHtml;
        }

        // =========================================================
        // 9. ส่งข้อมูลเข้า Google Sheets
        // =========================================================
        function submitToGoogleSheets(raw, net) {
            if (APP_SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") {
                alert("อย่าลืมใส่ URL ของ Google Apps Script ในโค้ดบรรทัดที่ 4 นะครับ!");
                return;
            }

            const submitBtn = document.querySelector("#action-buttons button");
            submitBtn.innerText = "UPLOADING TO HQ...";
            submitBtn.disabled = true;

            const payload = {
                unit: "Unit 3",
                studentId: currentStudentId,
                name: currentStudent.name,
                room: currentStudent.room,
                number: currentStudent.number,
                rawScore: raw,
                attempt: attemptCount,
                netScore: net
            };

            fetch(APP_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById("action-buttons").classList.add("hidden");
                document.getElementById("submit-status").innerText = "EVIDENCE UPLOADED SUCCESSFULLY!";
                document.getElementById("submit-status").classList.remove("hidden");
                localStorage.removeItem('M3_Unit3_Attempts_' + currentStudentId);
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาดในการส่งคะแนน โปรดตรวจสอบอินเทอร์เน็ตแล้วลองกดส่งใหม่");
                submitBtn.innerText = "Submit Evidence ➔";
                submitBtn.disabled = false;
            });
        }

        // =========================================================
        // 10. ฟังก์ชันเสริม: สุ่มข้อมูล (Fisher-Yates Shuffle)
        // =========================================================
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // =========================================================
        // 11. ระบบป้องกันการทุจริต (Anti-Cheat)
        // =========================================================
        function handleVisibilityChange() {
            if (document.hidden && !document.getElementById("quiz-screen").classList.contains("hidden")) {
                cheatWarnings++;
                if (cheatWarnings >= 3) {
                    alert("คุณสลับหน้าจอเกินกำหนด! ระบบทำการบังคับส่งข้อสอบทันที");
                    finishExam();
                } else {
                    alert(`คำเตือนการสลับหน้าจอ! (${cheatWarnings}/3) ห้ามสลับหน้าจอไปที่อื่นขณะทำข้อสอบ`);
                }
            }
        }

        function disableRightClick(e) { e.preventDefault(); }

        function enableAntiCheat() {
            document.addEventListener("visibilitychange", handleVisibilityChange);
            document.addEventListener("contextmenu", disableRightClick);
            document.addEventListener("selectstart", disableRightClick);
        }

        function disableAntiCheat() {
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            document.removeEventListener("contextmenu", disableRightClick);
            document.removeEventListener("selectstart", disableRightClick);
        }
    </script>

</body>
